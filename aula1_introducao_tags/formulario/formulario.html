<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    
    <!--  FORMULARIOS EM HTML  -->

    <form action=""> <!-- Estrutura do formulário -->

        <fieldset>
            <legend>Informações de Contato</legend>

            <label for="Nome">Nome:</label> <!-- Indicação do input -->
            <input type="text" id="Nome" name="nome" placeholder="Bota um nome ai mané" required> <!-- Campo de Entrada -->

          

            <br>

            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email" placeholder="Email agora zé" required>


            <br>

            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" placeholder="Senha agora vacilão" required>

            <br>

            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" name="dataNascimento" id="dataNascimento" required>

            <br>
        </fieldset>
        
        <fieldset>
            <legend>Preferências</legend>
            
            <p>Informe sua cor preferida:</p>
            <label><input type="radio" name="cor"> Azul</label>
            <label><input type="radio" name="cor">Vermelho</label>

            <p>Informe quais frutas você quer</p>
            <label><input type="checkbox" name="fruta">Maçã</label>
            <label><input type="checkbox" name="fruta">Banana</label>
            <label><input type="checkbox" name="fruta">Chinelo</label>
            <label><input type="checkbox" name="fruta">Pera</label>

            <br>

            <p>Escolhe um idioma</p>
            <label for="idioma">idioma</label>
            <select name="idioma" id="idioma">
                <option value="" disabled selected>Selecione uma opção</option>
                <option value="pt">Português</option>
                <option value="en">Inglês</option>
            </select>

            <br>

            <label for="sugestoes">Sugestões:</label>
            <textarea name="sugestoes" id="sugestoes"></textarea>

            <br>

            <button type="submit">Enviar</button>
        </fieldset>
        
    </form>
</body>
</html>
